---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: webtop
  namespace: utilities
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

    controllers:
      webtop:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/webtop
              tag: debian-xfce
              pullPolicy: Always
            env:
              TZ: ${TIMEZONE}
              PUID: "1000"
              PGID: "1000"
              HOME: /config
              DISPLAY: :1
              PIXELFLUX_WAYLAND: "false"
              DISABLE_ZINK: "true"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
          tailscale:
            image:
              repository: tailscale/tailscale
              tag: v1.102.2
              pullPolicy: Always
            command:
              - /bin/sh
              - -c
            args:
              - |
                mkdir -p /var/lib/tailscale /var/run/tailscale
                if [ -n "$TS_AUTHKEY" ]; then
                  tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock --tun=userspace-networking --socks5-server=0.0.0.0:1055 --outbound-http-proxy-listen=0.0.0.0:1055 >/tmp/tailscaled.log 2>&1 &
                  tailscaled_pid=$!
                  for i in $(seq 1 30); do
                    if tailscale --socket=/var/run/tailscale/tailscaled.sock status >/dev/null 2>&1; then
                      break
                    fi
                    sleep 2
                  done
                  tailscale --socket=/var/run/tailscale/tailscaled.sock up --authkey="$TS_AUTHKEY" --hostname="$TS_HOSTNAME" --accept-dns --ssh >/tmp/tailscale-up.log 2>&1 || true
                  wait "$tailscaled_pid"
                else
                  exec tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock --tun=userspace-networking --socks5-server=0.0.0.0:1055 --outbound-http-proxy-listen=0.0.0.0:1055
                fi
            env:
              TS_AUTHKEY:
                valueFrom:
                  secretKeyRef:
                    name: webtop-tailscale
                    key: authkey
              TS_HOSTNAME: webtop
              TS_STATE_DIR: /var/lib/tailscale
              TS_ACCEPT_DNS: "true"
            securityContext:
              allowPrivilegeEscalation: true
              capabilities:
                add:
                  - NET_ADMIN
                  - SYS_MODULE

    service:
      app:
        controller: webtop
        ports:
          http:
            port: 3000

    ingress:
      app:
        className: "traefik"
        annotations:
          hajimari.io/enable: "true"
          hajimari.io/icon: "desktop-classic"
          hajimari.io/appName: "Webtop"
          hajimari.io/group: "Utilities"
          cert-manager.io/cluster-issuer: "letsencrypt-production"
          external-dns.home.arpa/enabled: "true"
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
          traefik.ingress.kubernetes.io/router.middlewares: networking-chain-authentik@kubernetescrd
        hosts:
          - host: &uri "webtop.${SECRET_DEV_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *uri
            secretName: *uri

    persistence:
      config:
        existingClaim: webtop-config
        globalMounts:
          - path: /config
      nix:
        existingClaim: webtop-nix
        globalMounts:
          - path: /nix
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi
        globalMounts:
          - path: /dev/shm
      tailscale-state:
        type: emptyDir
        medium: Memory
        sizeLimit: 128Mi
        globalMounts:
          - path: /var/lib/tailscale
