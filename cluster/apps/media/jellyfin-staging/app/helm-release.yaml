---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin-staging
  namespace: media
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        type: statefulset
        pod:
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: "OnRootMismatch"
            supplementalGroups: [44, 109, 10000]
          nodeSelector:
            node-role.kubernetes.io/worker: "true"
            intel.feature.node.kubernetes.io/gpu: "true"
        containers:
          main:
            image:
              repository: docker.io/jellyfin/jellyfin
              tag: "10.10"
            env:
              TZ: Europe/Berlin
            resources:
              requests:
                gpu.intel.com/i915: 1
                cpu: 100m
                memory: 1000Mi
              limits:
                gpu.intel.com/i915: 1
                memory: 6000Mi

    service:
      main:
        controller: main
        ports:
          http:
            port: 8096
    ingress:
      main:
        className: "traefik"
        annotations:
          hajimari.io/enable: "true"
          hajimari.io/icon: "television-box"
          hajimari.io/group: "Media"
          cert-manager.io/cluster-issuer: "letsencrypt-production"
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
          external-dns.home.arpa/enabled: "true"
          external-dns.alpha.kubernetes.io/cloudflare-proxied:
            "false"
            #traefik.ingress.kubernetes.io/router.middlewares: networking-chain-authelia@kubernetescrd
        hosts:
          - host: &uri "jellyfin-staging.${SECRET_DEV_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
          - host: &uri-backup "jellyfin-staging.${SECRET_SOCIAL_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - *uri
              - *uri-backup
            secretName: *uri
    persistence:
      config:
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: local-path
        labels:
          snapshot.home.arpa/enabled: "true"
        globalMounts:
          - path: /config
      #media:
      #  existingClaim: media
      #  globalMounts:
      #    - path: /mnt/media
      #      mountPropagation: HostToContainer
      #media-smb:
      #  existingClaim: media-library-pvc
      #  globalMounts:
      #    - path: /mnt/media-smb
      logging-config:
        type: configMap
        name: jellyfin-staging-logging
        globalMounts:
          - path: /config/config/logging.json
            subPath: logging.json
            readOnly: true
      media-smb: # new
        type: custom
        volumeSpec:
          csi:
            driver: jellyfin-cache.csi.io
            readOnly: true
            volumeAttributes:
              server: jellyfin-cache.media.svc.cluster.local
        globalMounts:
          - path: /mnt/media-smb
